{% extends "base.html" %}

{% block content %}
  <button hx-get="{% url 'htmx_test_app:htmx_button_url' button_text='first' %}" hx-swap="outerHTML">Test button with url parameter</button>
  <br>
  <button hx-get="{% url 'htmx_test_app:htmx_button_htmx' %}" hx-swap="outerHTML" hx-vals='{"button_text": "second"}'>Test button with hx-vals</button>
  <br>
  {% if button_status == 'ON' %}
    <button hx-get="{% url 'htmx_test_app:htmx_button_toggle' button_status='OFF' %}" hx-swap="outerHTML">ON</button>
  {% else %}
    <button hx-get="{% url 'htmx_test_app:htmx_button_toggle' button_status='ON' %}" hx-swap="outerHTML">OFF</button>
  {% endif %}
{% endblock content %}
