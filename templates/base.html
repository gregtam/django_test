{% load static %}  <!DOCTYPE html>

<style type="text/tailwindcss">
  @layer components {
    .nav-links > li {
      @apply bg-green-400 hover:bg-red-400 rounded-lg p-2 mx-2 my-3;
    }

    .links > li > a {
      @apply inline-block bg-green-200 hover:bg-red-200 rounded-lg p-2 my-2;
    }

    .login > li > a {
      @apply inline-block bg-green-400 hover:bg-red-200 rounded-lg p-2 my-2;
    }

    button {
      @apply bg-blue-200 hover:bg-red-200 rounded-lg p-2 m-2;
    }

    table {
      @apply mb-10
    }

    tr, th {
      @apply border-2
    }
  }
</style>

<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/htmx.org@2.0.3"></script>
  <link rel="stylesheet" href="{% static 'base.css' %}">
</head>

<html>
  <body class="bg-green-50">
    {% block header %}
      <header class="bg-green-200 sticky top-0">
        <div class='flex'>
          <div class='flex-1'></div>
          <h1 class='text-center text-4xl text-green-900'>This is the {{ page_name }} page</h1>

          <div class='flex flex-1 gap-4 justify-end pr-4'>
            {% if user.is_authenticated %}

              <form method="POST" action="{% url 'logout' %}">
                {% csrf_token %}
                <button>Logout</button>
              </form>
            {% else %}
              <ul class="login flex justify-around gap-2">
                <li><a href="{% url 'login' %}">Login</a></li>
                <li><a href="{% url 'user_test_app:register' %}">Register</a></li>
              </ul>
            {% endif %}
          </div>
        </div>

        <nav>
          <ul class='flex justify-center nav-links'>
            <li><a href="{% url 'home' %}">Home</a></li>
            <li><a href="{% url 'crud_test_app:home' %}">CRUD Test</a></li>
            <li><a href="{% url 'better_crud_test_app:home' %}">Better CRUD Test</a></li>
            <li><a href="{% url 'htmx_test_app:home' %}">HTMX Test</a></li>
          </ul>
        </nav>
      </header>
    {% endblock header %}

    <div class="w-[95%] max-w-[1024px] mx-auto">
      {% block content %}
      {% endblock content %}
    </div>
 </body>
</html>
